name: rustfmt-once

on:
  push:
    branches: [agent/russian-localization]

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/russian-localization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt baseline
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo fmt --all
          cd ..
          changed="$(git diff --name-only)"
          test "$changed" = "src-tauri/src/session_manager/connect.rs"
      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/session_manager/connect.rs
          git rm .github/workflows/rustfmt-once.yml
          git diff --cached --check
          git commit -m "chore: rustfmt session baseline"
          git push origin HEAD:agent/russian-localization
