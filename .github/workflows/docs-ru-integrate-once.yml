name: docs-ru-integrate-once

on:
  push:
    branches: [agent/russian-localization]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/russian-localization
          fetch-depth: 0
      - name: Wire Russian README into docs maintenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{path}: expected text not found: {old!r}")
              text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8")

          lang_ru = '  <a href="./README_RU.md">Русский</a>'

          replace_once(
              "README.md",
              '  <a href="./README.md">English</a> ·\n  <a href="./README_ZH.md">中文</a>\n',
              '  <a href="./README.md">English</a> ·\n  <a href="./README_ZH.md">中文</a> ·\n' + lang_ru + '\n',
          )
          replace_once("README.md", "scheduled jobs, and bilingual UI.", "scheduled jobs, and multilingual UI.")
          replace_once(
              "README.md",
              "| **i18n** | Simplified Chinese / Traditional Chinese / English + tray |",
              "| **i18n** | Simplified Chinese / Traditional Chinese / English / Russian + tray |",
          )

          replace_once(
              "README_ZH.md",
              '  <a href="./README.md">English</a> ·\n  <a href="./README_ZH.md">中文</a>\n',
              '  <a href="./README.md">English</a> ·\n  <a href="./README_ZH.md">中文</a> ·\n' + lang_ru + '\n',
          )
          replace_once(
              "README_EN.md",
              '  <a href="./README.md">中文</a> ·\n  <a href="./README_EN.md">English</a>\n',
              '  <a href="./README.md">中文</a> ·\n  <a href="./README_EN.md">English</a> ·\n' + lang_ru + '\n',
          )

          replace_once(
              "scripts/update-contributors.py",
              "in README.md / README_EN.md / README_ZH.md.",
              "in README.md / README_EN.md / README_ZH.md / README_RU.md.",
          )
          replace_once(
              "scripts/update-contributors.py",
              '    "README_ZH.md",\n)',
              '    "README_ZH.md",\n    "README_RU.md",\n)',
          )
          replace_once(
              "scripts/update-contributors.py",
              '''        graph = "完整贡献图"\n    else:\n        thanks = (\n            f"Thanks to everyone who has contributed to Grok App. "\n            f"All human GitHub contributors (by commit count, updated {today})."\n        )\n        graph = "Full contributors graph"''',
              '''        graph = "完整贡献图"\n    elif lang == "ru":\n        thanks = (\n            f"Спасибо всем, кто внёс вклад в Grok App. "\n            f"Все участники GitHub — люди (по числу коммитов, обновлено {today})."\n        )\n        graph = "Полный граф участников"\n    else:\n        thanks = (\n            f"Thanks to everyone who has contributed to Grok App. "\n            f"All human GitHub contributors (by commit count, updated {today})."\n        )\n        graph = "Full contributors graph"''',
          )
          replace_once(
              "scripts/update-contributors.py",
              '''    if name in ("readme_zh.md", "readme.zh.md"):\n        return "zh"\n    return "en"''',
              '''    if name in ("readme_zh.md", "readme.zh.md"):\n        return "zh"\n    if name in ("readme_ru.md", "readme.ru.md"):\n        return "ru"\n    return "en"''',
          )

          replace_once(
              "AGENTS.md",
              "README.md / README_EN.md / README_ZH.md markers",
              "README.md / README_EN.md / README_ZH.md / README_RU.md markers",
          )

          replace_once(
              "docs/llm-wiki/release.md",
              "`README.md` / `README_EN.md` / `README_ZH.md` 内",
              "`README.md` / `README_EN.md` / `README_ZH.md` / `README_RU.md` 内",
          )
          replace_once(
              "docs/llm-wiki/release.md",
              "git add README.md README_EN.md README_ZH.md",
              "git add README.md README_EN.md README_ZH.md README_RU.md",
          )
          PY
      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md README_ZH.md AGENTS.md docs/llm-wiki/release.md scripts/update-contributors.py
          git rm .github/workflows/docs-ru-integrate-once.yml
          git diff --cached --check
          git commit -m "docs: integrate Russian README maintenance"
          git push origin HEAD:agent/russian-localization
